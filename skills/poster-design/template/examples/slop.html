<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What an unprompted AI poster looks like (DO NOT COPY)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* The "before". Same event as riso.html. It exists so you can see the tells and so the linter has something to catch. */
:root{--W:1200px;--H:1600px}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:#111}
.stage{width:calc(var(--W)*var(--fit,1));height:calc(var(--H)*var(--fit,1))}
.poster{width:var(--W);height:var(--H);position:relative;overflow:hidden;transform:scale(var(--fit,1));transform-origin:0 0;
  background:linear-gradient(135deg,#6a11cb 0%,#2575fc 50%,#ff6ec4 100%);
  font-family:'Inter',sans-serif;color:#fff;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:80px}
.orb{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#ff6ec4,transparent 70%);top:-120px;right:-120px;filter:blur(40px)}
.eyebrow{font-size:22px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
h1{font-size:120px;font-weight:800;line-height:1.05;text-shadow:0 0 40px rgba(255,255,255,.6);background:linear-gradient(90deg,#fff,#ffd1ff);-webkit-background-clip:text;color:transparent}
.sub{font-size:34px;font-weight:300;max-width:800px;line-height:1.4}
.card{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.3);border-radius:32px;padding:44px 64px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:34px;line-height:1.6}
.btn{background:#fff;color:#6a11cb;border-radius:999px;padding:22px 64px;font-size:30px;font-weight:700;box-shadow:0 10px 40px rgba(255,255,255,.4)}
@page{size:1200px 1600px;margin:0}
</style>
</head>
<body>
<div class="stage">
<main class="poster">
  <div class="orb"></div>
  <div class="eyebrow">✨ Live Music Experience</div>
  <h1>Unleash the Future of Live Music</h1>
  <p class="sub">Join us for an unforgettable night where sound meets soul, featuring Salt Flats — reimagined.</p>
  <div class="card">🎸 Friday 14 March · 7:00 PM<br>📍 The Anchor, 12 Quay Street<br>🎟️ Tickets $15</div>
  <div class="btn">Get Tickets →</div>
</main>
</div>
<script>
(()=>{if(window.__RENDER__)return;const p=document.querySelector('.poster');
const fit=()=>document.documentElement.style.setProperty('--fit',Math.min(innerWidth/p.offsetWidth,innerHeight/p.offsetHeight));
fit();addEventListener('resize',fit)})();
</script>
</body>
</html>
